name: Newsletter FishPoint

# Wysyła digest najnowszych wpisów do subskrybentów (tabela fishpoint_subscribers).
# Harmonogram: w piątki o 07:00 UTC. Można też odpalić ręcznie (workflow_dispatch),
# w tym w trybie próbnym (dry_run=true) — wtedy nic nie wysyła, tylko loguje.
on:
  schedule:
    - cron: '0 7 * * 5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Tryb próbny (nie wysyła maili)'
        type: boolean
        default: false

concurrency:
  group: newsletter
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: npm init -y >/dev/null 2>&1 && npm install pg@8 --no-save
      - name: Send newsletter
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FISHPOINT_NEWSLETTER_FROM: ${{ secrets.FISHPOINT_NEWSLETTER_FROM }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: node scripts/newsletter/send.mjs

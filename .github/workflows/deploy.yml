name: Deploy to Railway

# Każdy push do main automatycznie wdraża stronę na produkcję (fish-point.pl).
# Niezależne od webhooków Railway GitHub App — używa project tokenu (sekret RAILWAY_TOKEN).
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Kalendarze brań mają w tytule bieżący miesiąc (seo_inject.ensure_calendar_month).
  # Bez wdrożenia pierwszego dnia miesiąca tytuł zostałby w poprzednim miesiącu,
  # co szkodzi bardziej niż jego brak. 04:10 UTC = po północy czasu polskiego.
  schedule:
    - cron: '10 4 1 * *'

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Generate SEO artifacts
        run: python3 seo_inject.py

      # Warianty 640/960 px muszą istnieć na dysku, zanim optimize_images
      # złoży srcset — bez nich telefon dostaje obraz w pełnej rozdzielczości.
      # Skrypt jest idempotentny i pomija warianty już obecne w repo.
      - name: Generate responsive image variants
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick libavif-bin || true
          python3 scripts/make-responsive-images.py

      # seo_inject regeneruje blok article-visual jako goły <img>, więc
      # opakowanie w <picture> musi powstać po nim — inaczej produkcja traci
      # warianty AVIF/WebP obecne w repo. Skrypt jest idempotentny.
      - name: Wrap images in <picture> (AVIF/WebP)
        run: python3 optimize_images.py

      - name: Validate generated artifacts
        run: python3 seo_inject.py --validate

      - name: Audit content contracts
        run: python3 scripts/audit-contracts.py

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Deploy
        run: railway up --service fishpoint --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      # Railway CLI potrafi zwrócić kod 1, mimo że wdrożenie się powiodło —
      # przerywa streamowanie logów budowania po ok. minucie („Failed to stream
      # build logs"). Bez tego warunku gubiliśmy zgłoszenie do IndexNow przy
      # poprawnie wdrożonej stronie. Krok Deploy celowo dalej raportuje błąd,
      # żeby prawdziwa awaria pozostała widoczna.
      - name: Submit changed URLs to IndexNow
        if: always()
        run: node scripts/submit-indexnow.mjs
        env:
          BEFORE_SHA: ${{ github.event.before }}

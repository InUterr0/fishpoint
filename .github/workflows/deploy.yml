name: Deploy to Railway

# Każdy push do main automatycznie wdraża stronę na produkcję (fish-point.pl).
# Niezależne od webhooków Railway GitHub App — używa project tokenu (sekret RAILWAY_TOKEN).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate SEO artifacts
        run: python3 seo_inject.py

      - name: Validate generated artifacts
        run: python3 seo_inject.py --validate

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Deploy
        run: railway up --service fishpoint --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

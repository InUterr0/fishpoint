name: Deploy to Railway

# Każdy push do main automatycznie wdraża stronę na produkcję (fish-point.pl).
# Niezależne od webhooków Railway GitHub App — używa project tokenu (sekret RAILWAY_TOKEN).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Strony miesięczne muszą powstać przed wstrzyknięciem metadanych. Krok
      # pilnuje też, żeby rejestr miesięczny nie rozjechał się z prawnym.
      - name: Generate monthly protection pages
        run: python3 build_miesiace.py

      - name: Generate SEO artifacts
        run: python3 seo_inject.py

      # seo_inject regeneruje blok article-visual jako goły <img>, więc
      # opakowanie w <picture> musi powstać po nim — inaczej produkcja traci
      # warianty AVIF/WebP obecne w repo. Skrypt jest idempotentny.
      - name: Wrap images in <picture> (AVIF/WebP)
        run: python3 optimize_images.py

      - name: Validate generated artifacts
        run: python3 seo_inject.py --validate

      - name: Audit content contracts
        run: python3 scripts/audit-contracts.py

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Deploy
        run: railway up --service fishpoint --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Submit changed URLs to IndexNow
        run: node scripts/submit-indexnow.mjs
        env:
          BEFORE_SHA: ${{ github.event.before }}
